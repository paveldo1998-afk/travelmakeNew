<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#EFF4F8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="description" content="TravelOrganizer — мобильный мультитул для путешественников" />
  <title>TravelOrganizer</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="signal">
  <div class="device-stage">
    <div class="app-shell" id="app">
      <header class="app-header" id="app-header">
        <h2 id="trip-heading">Поездки</h2>
        <p class="trip-meta" id="trip-meta">Мультитул для путешественников</p>
        <div class="header-actions" id="header-actions"></div>
      </header>
      <div class="page" id="content" role="main" aria-live="polite"></div>
      <nav class="bottom-nav hidden" id="nav" aria-label="Разделы поездки"></nav>
    </div>
  </div>

  <dialog id="dialog" aria-labelledby="dialog-head">
    <div class="dialog-inner" id="dialog-body"></div>
  </dialog>
  <div id="toast" class="hidden" role="status"></div>
  <div id="coin-ghost" class="coin-ghost hidden" aria-hidden="true"></div>

  <script src="app.js"></script>
</body>
</html>
