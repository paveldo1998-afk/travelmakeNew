<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FBF6EB">
  <meta name="description" content="TravelOrganizer — поездки, сборы, планы, документы и бюджет. Локальный режим разработки и отдельный демонстрационный режим.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TravelOrganizer">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self'; object-src 'self' blob:; frame-src 'self' blob:; worker-src 'self'; base-uri 'self'; form-action 'self'">
  <title>TravelOrganizer</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="icon" href="./assets/icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" sizes="180x180">
  <link rel="preload" href="./assets/fonts/golos-text.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#content">Перейти к содержимому</a>
  <div id="app" class="app-shell">
    <div id="mode-bar" class="mode-bar"></div>
    <div id="pwa-status" class="pwa-status" role="status" aria-live="polite"></div>
    <div id="update-banner" class="update-banner" hidden></div>
    <header id="app-header" class="app-header"></header>
    <main id="content" class="page" tabindex="-1">
      <section class="boot-loading" aria-label="Загрузка приложения">
        <h1>TravelOrganizer</h1>
        <p>Открываем ваши поездки на этом устройстве…</p>
        <noscript><p>Для работы органайзера включите JavaScript в настройках браузера.</p></noscript>
      </section>
    </main>
    <nav id="nav" class="bottom-nav" aria-label="Разделы приложения"></nav>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title" aria-modal="true">
    <div id="dialog-body" class="dialog-inner"></div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="boot-error" class="boot-error" role="alert" hidden></div>
</body>
</html>
