<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#EFF4F8" />
  <meta name="description" content="TravelOrganizer — мультитул для путешественников: сборы, план, документы и финансы" />
  <title>TravelOrganizer</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="signal">
  <div class="app-shell" id="app">
    <header class="app-header" id="app-header">
      <h2 id="trip-heading">Поездки</h2>
      <p class="trip-meta" id="trip-meta">Мультитул для путешественников</p>
      <div class="header-actions" id="header-actions"></div>
    </header>
    <div class="page" id="content" role="main" aria-live="polite"></div>
    <nav class="bottom-nav hidden" id="nav" aria-label="Разделы поездки"></nav>
  </div>

  <dialog id="dialog" aria-labelledby="dialog-head">
    <div class="dialog-inner" id="dialog-body"></div>
  </dialog>
  <div id="toast" class="hidden" role="status"></div>
  <div id="coin-ghost" class="coin-ghost hidden" aria-hidden="true"></div>

  <script src="app.js"></script>
</body>
</html>
